<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SlipCast</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <meta name="description" content="SlipCast: delivery analytics for software teams.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script>
    // Apply the saved theme before the app loads, so there is no flash of the wrong one.
    try { if (localStorage.getItem('slipcast_theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#F3F5FA'; } } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
